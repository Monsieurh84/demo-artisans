<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bureau + technicien · démo</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="demo/brand.js"></script>
<link rel="stylesheet" href="demo/demo.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:#E7EAF1;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;font-weight:800;font-size:14px;flex:none}
.bar span{color:#B9C1D6;font-weight:600}.bar a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:13px}
.stage{flex:1;display:flex;gap:22px;padding:18px;min-height:0}
.desk{flex:1;min-width:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(11,16,32,.18);display:flex;flex-direction:column}
.desk .chrome{height:34px;background:#F1F3F7;border-bottom:1px solid #E2E6EF;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none}.desk .chrome i{width:11px;height:11px;border-radius:50%;background:#D5D9E2}
.desk .chrome b{margin-left:10px;font-size:12px;color:#7A8299;font-weight:700}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.phone{width:380px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.dev{width:380px;height:min(780px,100%);background:#0D0F12;border-radius:52px;padding:12px;box-shadow:0 30px 70px rgba(11,16,32,.35),inset 0 0 0 2px #2A2F37;position:relative}
.dev::before{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:18px;background:#000;z-index:2}
.dev iframe{border-radius:40px}
.hint{font-size:13px;color:#5E6680;font-weight:700;text-align:center;max-width:360px}
@media (max-width:980px){.phone{display:none}}
</style>
</head>
<body>
<div class="bar">Démo en direct <span id="t"></span><a id="back">← Accueil de la démo</a></div>
<div class="stage">
  <div class="desk"><div class="chrome"><i></i><i></i><i></i><b>Application bureau</b></div><iframe id="b" title="Application bureau"></iframe></div>
  <div class="phone"><div class="dev"><iframe id="p" title="Application technicien"></iframe></div><p class="hint">Sur le téléphone : ouvrez une intervention, « Je pars », « Je suis sur place », ajoutez une photo et validez. Le bureau la reçoit aussitôt dans « À contrôler ».</p></div>
</div>
<script src="demo/mock.js"></script>
<script>
supabase.createClient().from('techniciens').select('id').then(() => {});
const q = location.search;
document.getElementById('t').textContent = '· ' + BRAND.nom + ' · ' + BRAND.metierLabel;
document.getElementById('b').src = 'app/index.html' + q;
document.getElementById('p').src = 'app/tech.html' + q;
document.getElementById('back').href = 'index.html' + q;
</script>
</body>
</html>
