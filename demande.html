<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Demande d’intervention · démo</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="demo/brand.js"></script>
<link rel="stylesheet" href="demo/demo.css">
<style>
:root{--ink:#0E1630;--mute:#5E6680;--line:#E2E6EF;--bg:#F4F6FA}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.hd{background:var(--navy);color:#fff;padding:18px 20px calc(70px);position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;inset:0;background:radial-gradient(600px 260px at 100% -10%,var(--electric),transparent 65%);opacity:.55}
.hd .in{position:relative;z-index:1;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:40px;height:40px;border-radius:11px}
.hd h1{font-family:Sora,Manrope,sans-serif;font-size:clamp(24px,6vw,32px);letter-spacing:-.02em;margin:22px 0 6px}.hd p{margin:0;color:#C9CFE0}
.wrap{max-width:640px;margin:-50px auto 40px;padding:0 16px;position:relative;z-index:2}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(14,22,48,.08)}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--grad)}
h2{font-family:Sora,Manrope,sans-serif;font-size:20px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px;font-size:14.5px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;text-align:left;font-weight:800;display:flex;flex-direction:column;gap:10px;min-height:96px}
.svc button:hover{border-color:var(--electric)}.svc .i{width:26px;height:26px;color:var(--electric)}
.ph{display:grid;gap:12px}
.shot{border:2px dashed var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.shot.ok{border-style:solid;border-color:#9FDCC0;background:#F3FBF7}.shot.skip{opacity:.6}
.shot .th{width:72px;height:72px;border-radius:12px;background:var(--soft) center/cover;display:grid;place-items:center;color:var(--electric)}
.shot b{display:block}.shot small{color:var(--mute)}
.shot .act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 14px;font-weight:800;text-decoration:none}
.b1{background:var(--grad);color:#fff}.b2{background:#fff;border:2px solid var(--line)}.b3{background:none;color:var(--mute);padding:10px 6px;font-weight:700}
.big{width:100%;height:56px;font-size:17px;margin-top:18px}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input.f,textarea.f{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:600;background:#fff}input.f:focus,textarea.f:focus{outline:none;border-color:var(--electric)}
textarea.f{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:120px 1fr;gap:10px}
.urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.urg label{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:800;font-size:14px;cursor:pointer}.urg input{display:none}.urg label:has(input:checked){border-color:var(--electric);background:var(--soft)}
.back{margin-top:10px}
.done{text-align:center;padding:10px 0}.done .ok{width:64px;height:64px;border-radius:50%;background:#E6F6EF;color:#0E9F6E;display:grid;place-items:center;margin:0 auto 12px}.done .ok .i{width:32px;height:32px}
.ref{display:inline-block;background:var(--soft);color:var(--indigo);font-weight:800;border-radius:10px;padding:6px 12px;margin:8px 0 16px}
.i{width:1.15em;height:1.15em;vertical-align:-.2em}
.foot{text-align:center;color:var(--mute);font-size:12.5px;margin-top:18px}
@media (max-width:420px){.svc{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hd"><div class="in"><div class="brand"><img id="lg" alt=""><span id="bn"></span></div><h1>Demande d’intervention</h1><p>Décrivez votre besoin en 2 minutes, avec quelques photos : nous revenons vers vous rapidement.</p></div></header>
<main class="wrap"><div class="card" id="w"></div><p class="foot">Démo : rien n’est réellement envoyé. La demande apparaît dans l’application bureau de la démo.</p></main>
<script src="demo/mock.js"></script>
<script src="app/icons.js"></script>
<script>
const B = BRAND, sb = supabase.createClient(), $ = s => document.querySelector(s);
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('#lg').src = B.logo; $('#bn').textContent = B.nom;
const SV = B.METIERS[B.metier].demandes.map(([n, msg, ph]) => ({ n, ph })).concat([{ n: 'Autre demande', ph: ['Photo du problème'] }]);
const icoFor = n => /autre/i.test(n) ? 'message' : /panne|fuite|qui fuit|bloqu|perdu/i.test(n) ? 'alarm' : /entretien|contrat/i.test(n) ? 'check-circle' : /rénovation|salle de bain|cuisine|mur|peinture|porte blindée/i.test(n) ? 'helmet' : /borne|éclairage|tableau/i.test(n) ? 'sun' : 'wrench';
let st = { s: null, shots: [], step: 0 };
const steps = k => `<div class="steps">${[0, 1, 2, 3].map(i => `<i class="${i <= k ? 'on' : ''}"></i>`).join('')}</div>`;
function draw() {
  const w = $('#w');
  if (st.step === 0) { w.innerHTML = steps(0) + `<h2>Quel est votre besoin ?</h2><p class="sub">Choisissez ce qui correspond le mieux.</p><div class="svc">${SV.map((s, k) => `<button data-k="${k}">${ic(icoFor(s.n))}${E(s.n)}</button>`).join('')}</div>`;
    w.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { st.s = SV[+b.dataset.k]; st.shots = st.s.ph.map(l => ({ l, d: null, skip: false })); st.step = 1; draw(); }); }
  if (st.step === 1) { w.innerHTML = steps(1) + `<h2>Vos photos</h2><p class="sub">Elles nous permettent de venir avec le bon matériel et de chiffrer plus vite.</p><div class="ph">${st.shots.map((p, k) => `<div class="shot ${p.d ? 'ok' : p.skip ? 'skip' : ''}"><div class="th" style="${p.d ? `background-image:url('${p.d}')` : ''}">${p.d ? '' : ic('camera')}</div><div><b>${E(p.l)}</b><small>${p.d ? 'Photo ajoutée' : p.skip ? 'Pas de photo' : 'Prenez la photo ou choisissez-la dans la galerie'}</small>
    <div class="act"><label class="btn ${p.d ? 'b2' : 'b1'}">${ic('camera')} ${p.d ? 'Reprendre' : 'Photo'}<input type="file" accept="image/*" capture="environment" hidden data-in="${k}"></label>${p.d ? '' : `<button class="btn b3" data-skip="${k}">${p.skip ? 'Annuler' : 'Je ne peux pas'}</button>`}</div></div></div>`).join('')}</div>
    <button class="btn b1 big" id="nx">Continuer</button><button class="btn b3 back" id="bk">‹ Changer de besoin</button>`;
    w.querySelectorAll('[data-in]').forEach(i => i.onchange = async () => { const f = i.files[0]; if (!f) return; st.shots[+i.dataset.in].d = await shrink(f); st.shots[+i.dataset.in].skip = false; draw(); });
    w.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { const p = st.shots[+b.dataset.skip]; p.skip = !p.skip; draw(); });
    $('#nx').onclick = () => { st.step = 2; draw(); }; $('#bk').onclick = () => { st.step = 0; draw(); }; }
  if (st.step === 2) { w.innerHTML = steps(2) + `<h2>Quelques précisions</h2><p class="sub">${E(st.s.n)}</p><label class="f" for="msg">Décrivez la situation</label><textarea class="f" id="msg" placeholder="Depuis quand, ce que vous avez remarqué…">${E(st.msg || '')}</textarea>
    <label class="f">Délai souhaité</label><div class="urg">${[['urgent', 'Urgent'], ['semaine', 'Cette semaine'], ['pas-presse', 'Pas pressé']].map(([v, l]) => `<label><input type="radio" name="u" value="${v}" ${(st.u || 'semaine') === v ? 'checked' : ''}>${l}</label>`).join('')}</div>
    <button class="btn b1 big" id="nx">Continuer</button><button class="btn b3 back" id="bk">‹ Retour aux photos</button>`;
    $('#nx').onclick = () => { st.msg = $('#msg').value; st.u = document.querySelector('[name=u]:checked').value; st.step = 3; draw(); }; $('#bk').onclick = () => { st.step = 1; draw(); }; }
  if (st.step === 3) { w.innerHTML = steps(3) + `<h2>Vos coordonnées</h2><p class="sub">Pour vous rappeler et fixer le rendez-vous.</p><form id="f"><label class="f" for="nm">Nom et prénom</label><input class="f" id="nm" required autocomplete="name">
    <label class="f" for="tl">Téléphone</label><input class="f" id="tl" type="tel" required autocomplete="tel"><label class="f" for="ad">Adresse de l’intervention</label><input class="f" id="ad" autocomplete="street-address">
    <div class="row"><div><label class="f" for="cp">Code postal</label><input class="f" id="cp" inputmode="numeric" maxlength="5"></div><div><label class="f" for="vl">Ville</label><input class="f" id="vl" value="${E(B.ville)}"></div></div>
    <button class="btn b1 big" id="go" type="submit">Envoyer ma demande</button></form><button class="btn b3 back" id="bk">‹ Retour</button>`;
    $('#bk').onclick = () => { st.step = 2; draw(); };
    $('#f').onsubmit = async e => { e.preventDefault(); const b = $('#go'); b.disabled = true; b.textContent = 'Envoi…';
      const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), photos = [];
      for (const [k, p] of st.shots.entries()) if (p.d) { const path = `${id}/${k + 1}.jpg`; await sb.storage.from('demandes').upload(path, await (await fetch(p.d)).blob()); photos.push({ label: p.l, path }); }
      const { data: ref } = await sb.rpc('envoyer_demande', { p: { id, service_id: st.s.n, service: st.s.n, nom: $('#nm').value.trim(), tel: $('#tl').value.trim(), email: '', adresse: $('#ad').value.trim(), cp: $('#cp').value.trim(), ville: $('#vl').value.trim(), message: st.msg || '', urgence: st.u || 'semaine', profil: 'Particulier', photos, manquantes: st.shots.filter(p => !p.d).map(p => p.l) } });
      w.innerHTML = `<div class="done"><div class="ok">${ic('check')}</div><h2>Demande envoyée</h2><p class="sub">Merci ! ${E(B.nom)} vous rappelle très vite.</p><div class="ref">N° ${E(ref)}</div>
        <p class="sub"><b>Côté entreprise :</b> la demande vient d’arriver en direct dans l’application bureau, avec vos photos.</p><a class="btn b1 big" href="app/index.html${location.search}#demandes">Voir la demande dans le bureau</a><button class="btn b3 back" onclick="st={s:null,shots:[],step:0};draw()">Faire une autre demande</button></div>`; };
  }
}
function shrink(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82)); }; im.src = r.result; }; r.readAsDataURL(f); }); }
draw();
</script>
<script src="demo/demo.js"></script>
</body>
</html>
